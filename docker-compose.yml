# Postgres propio de Margarita Renace.
#
# Puerto 5434, NO el 5433 de Leiros: son productos independientes y no comparten
# base de datos. Es una regla del servidor (ver /root/proyectos/README.md).
#
# Bind a 127.0.0.1: la base nunca se expone a internet, solo la alcanzan las
# apps locales. El firewall tampoco abre el puerto, pero el bind explícito es
# una defensa que no depende de que ufw esté bien configurado.

services:
  postgres:
    image: postgres:16-alpine
    container_name: margarita_postgres
    restart: always
    environment:
      POSTGRES_DB: margarita
      POSTGRES_USER: margarita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - margarita_pgdata:/var/lib/postgresql/data
      # El esquema se aplica SOLO en la primera creación del volumen. Para
      # cambios posteriores hacen falta migraciones, no editar este archivo.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margarita -d margarita"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  margarita_pgdata:
